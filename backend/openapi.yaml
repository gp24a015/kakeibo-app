openapi: 3.0.3
info:
  title: 家計簿アプリ API
  version: 1.0.0
  description: |
    Honoで実装された家計簿アプリのバックエンドAPIです。
    取引データはPostgreSQLに保存されます。
servers:
  - url: http://localhost:3000
    description: ローカル開発環境

tags:
  - name: Transactions
    description: 取引の取得・登録

paths:
  /transactions:
    get:
      tags:
        - Transactions
      summary: 取引一覧を取得
      description: |
        取引一覧と件数・合計金額を返します。
        typeに応じて収入、支出、または全取引を取得します。
      operationId: getTransactions
      parameters:
        - name: type
          in: query
          required: true
          description: 取得対象として指定する取引種別（現在は値の検証にのみ使用）
          schema:
            type: string
            enum:
              - income
              - expense
              - all
      responses:
        "200":
          description: 取引一覧の取得に成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
              example:
                transactions:
                  - id: 1
                    item: 給料
                    amount: 100000
                    date: "2025-01-02"
                  - id: 2
                    item: 食費
                    amount: -10000
                    date: "2025-01-03"
                totalCount: 2
                totalAmount: 90000
        "400":
          $ref: "#/components/responses/InvalidTransactionType"

    post:
      tags:
        - Transactions
      summary: 取引を登録
      description: |
        取引データを検証し、受け取ったデータを201レスポンスとして返します。
        現状の実装ではデータは保存されません。
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTransaction"
            examples:
              income:
                summary: 収入の例
                value:
                  item: 給料
                  amount: 100000
                  date: "2025-01-02"
              expense:
                summary: 支出の例
                value:
                  item: 食費
                  amount: -10000
                  date: "2025-01-03"
      responses:
        "201":
          description: 取引の登録に成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewTransaction"
              example:
                id: 3
                item: 食費
                amount: -10000
                date: "2025-01-03"
        "400":
          $ref: "#/components/responses/InvalidTransaction"

components:
  schemas:
    Transaction:
      type: object
      required:
        - id
        - item
        - amount
        - date
      properties:
        id:
          type: integer
          example: 1
        item:
          type: string
          example: 給料
        amount:
          type: number
          description: 0以外の金額。アプリでは収入を正数、支出を負数として扱います。
          example: 100000
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: YYYY-MM-DD形式の日付
          example: "2025-01-02"

    NewTransaction:
      type: object
      required:
        - item
        - amount
        - date
      properties:
        item:
          type: string
          minLength: 1
          description: 取引項目
          example: 食費
        amount:
          type: number
          description: 0以外の金額。アプリでは収入を正数、支出を負数として扱います。
          not:
            enum:
              - 0
          example: -10000
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: YYYY-MM-DD形式の日付
          example: "2025-01-03"

    TransactionList:
      type: object
      required:
        - transactions
        - totalCount
        - totalAmount
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        totalCount:
          type: integer
          example: 2
        totalAmount:
          type: number
          example: 90000

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: 必須項目が不足しています

  responses:
    InvalidTransactionType:
      description: typeが未指定、または許可されていない値
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: typeはincome, expense, allのいずれかである必要があります

    InvalidTransaction:
      description: 必須項目、金額、または日付の形式が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingField:
              summary: 必須項目が不足
              value:
                message: 必須項目が不足しています
            invalidAmount:
              summary: 金額が0または数値ではない
              value:
                message: 金額は0以外の数値である必要があります
            invalidDate:
              summary: 日付形式が不正
              value:
                message: 日付はYYYY-MM-DD形式で入力してください
